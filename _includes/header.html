<header class="site-header" role="banner">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">Masud Rahman</a>

    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      <span class="sr-only">Toggle navigation</span>
    </button>

    <nav id="site-nav" class="site-nav" role="navigation" aria-label="Main">
      {% assign here = page.url %}
      <a href="{{ '/' | relative_url }}"
         {% if here == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/research/' | relative_url }}"
         {% if here == '/research/' %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/open-source/' | relative_url }}"
         {% if here == '/open-source/' %}aria-current="page"{% endif %}>Open-Source</a>
    </nav>
  </div>
</header>
