name: Build & Deploy (Jekyll + Pages)

on:
  push:
    branches: [ main, fresh-start ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # keep one shared R library for all steps
    env:
      R_LIBS_USER: ${{ github.workspace }}/.Rlib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev pkg-config

      - name: Install R packages
        run: |
          mkdir -p "${R_LIBS_USER}"
          Rscript -e 'lib <- Sys.getenv("R_LIBS_USER"); dir.create(lib, showWarnings=FALSE, recursive=TRUE); .libPaths(c(lib, .libPaths())); pkgs <- c("jsonlite","httr"); miss <- setdiff(pkgs, rownames(installed.packages(lib.loc=lib))); if (length(miss)) install.packages(miss, repos="https://cloud.r-project.org", lib=lib); for (p in pkgs) {suppressPackageStartupMessages(library(p, character.only=TRUE))}; print(.libPaths()); sessionInfo()'

      - name: Enrich project data (GitHub API)
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_READ }}
        run: |
          Rscript scripts/build_projects.R

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4