name: Build & Deploy (Jekyll + Pages)

on:
  push:
    branches: [ main, fresh-start ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-
            
      - name: Install R packages
        run: |
          Rscript -e 'packages <- c("jsonlite","httr"); to_install <- setdiff(packages, rownames(installed.packages())); if(length(to_install)) install.packages(to_install, repos="https://cloud.r-project.org")'
      - name: Enrich project data (GitHub API)
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_READ }}
        run: |
          Rscript scripts/build_projects.R

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
